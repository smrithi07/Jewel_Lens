<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jewel Lens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <header class="hero">
            <h1>Jewel Lens ✨</h1>
            <p>Upload a photo of earrings, necklaces or bracelets and find matching pieces from our catalogue.</p>
        </header>

        <div class="upload-card">
            <input type="file" id="fileInput" accept="image/*">
            <button onclick="upload()">Find Matches</button>
        </div>

        <div id="filterBar" class="filter-bar" style="display:none;">
            <label for="sortBy">Sort</label>
            <select id="sortBy" onchange="reFilter()">
                <option value="relevance">Relevance</option>
                <option value="price_low">Price: Low to High</option>
                <option value="price_high">Price: High to Low</option>
            </select>
            <label for="minPrice">Min ₹</label>
            <input type="number" id="minPrice" min="0" onchange="reFilter()">
            <label for="maxPrice">Max ₹</label>
            <input type="number" id="maxPrice" min="0" onchange="reFilter()">
        </div>

        <div id="status" role="status"></div>
        <div id="queryPreviewContainer" style="display:none;">
            <h3>Your photo</h3>
            <img id="queryPreviewImg" alt="Uploaded photo" />
        </div>
        <div id="results"></div>
    </div>

    <script src="app.js"></script>
</body>

</html>
